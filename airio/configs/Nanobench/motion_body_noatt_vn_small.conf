general:
{
   exp_dir: experiments/nanobench_noatt_vn_small
}

dataset:
{
   include "../datasets/Nanobench/nanobench_body.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codenetmotion_small     # /3-channel-reduced VN-AirIO, no attitude (~0.033M params)

   lr: 1e-3
   min_lr: 1e-5
   batch_size: 128
   max_epoches: 80
   patience: 5
   factor: 0.2
   weight_decay: 1e-3

   weight: 1e2
   cov_weight: 1e-4
   propcov: True
   covaug: True
   loss: Huber_loss005
   rotloss: Huber_loss005

   save_freq: 5
   eval_freq: 1
}
