general:
{
   exp_dir: experiments/tlio_noatt_vn
}

dataset:
{
   include "../datasets/TLIO/tlio_body.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codenetmotion

   lr: 1e-3
   min_lr: 1e-5
   batch_size: 128
   max_epoches: 30    # TLIO is much larger than Nanobench; 30 epochs at step=50 ≈ Nanobench's 80 epochs in total compute
   patience: 5
   factor: 0.2
   weight_decay: 1e-3

   weight: 1e2
   cov_weight: 1e-4
   propcov: True
   covaug: True
   loss: Huber_loss005
   rotloss: Huber_loss005

   save_freq: 5
   eval_freq: 1
}
