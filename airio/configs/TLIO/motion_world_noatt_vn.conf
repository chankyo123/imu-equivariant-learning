// World-frame VN-AirIO (no attitude input). Fair-comparison setup vs EqNIO.
// IMU rotated to world, gravity removed. Model predicts world-frame velocity.
general:
{
   exp_dir: experiments/tlio_world_noatt_vn
}

dataset:
{
   include "../datasets/TLIO/tlio_world.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codenetmotion

   lr: 1e-3
   min_lr: 1e-6
   batch_size: 256
   max_epoches: 30
   patience: 5
   factor: 0.2
   weight_decay: 1e-3

   weight: 1e2
   cov_weight: 1e-4
   propcov: True
   covaug: True
   loss: Huber_loss005
   rotloss: Huber_loss005

   save_freq: 30
   eval_freq: 5
}
