// World-frame VN-AirIO with attitude input. (Attitude provided as 3rd vector channel.)
general:
{
   exp_dir: experiments/tlio_world_rot_vn
}

dataset:
{
   include "../datasets/TLIO/tlio_world.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codewithrot

   lr: 1e-3
   min_lr: 1e-6
   batch_size: 256
   max_epoches: 30
   patience: 5
   factor: 0.2
   weight_decay: 1e-3

   weight: 1e2
   cov_weight: 1e-4
   propcov: True
   covaug: True
   loss: Huber_loss005
   rotloss: Huber_loss005

   save_freq: 30
   eval_freq: 5
}
