general:
{ exp_dir: experiments/sweep_vn_airio/t0000_vn_codewithrot }

dataset:
{
   include "../datasets/TLIO/tlio_body.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codewithrot
   lr: 0.006425332574774159
   min_lr: 1e-6
   batch_size: 256
   max_epoches: 30
   patience: 5
   factor: 0.2
   weight_decay: 0.0007102575867829847
   weight: 1e2
   cov_weight: 1e-4
   propcov: True
   covaug: True
   loss: Huber_loss05
   rotloss: Huber_loss005
   save_freq: 30
   eval_freq: 5
}
