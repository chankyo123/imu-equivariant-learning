general:
{ exp_dir: experiments/sweep_vn_airio/t0002_vn_codewithrot }

dataset:
{
   include "../datasets/TLIO/tlio_body.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codewithrot
   lr: 0.005405466983406397
   min_lr: 1e-6
   batch_size: 512
   max_epoches: 25
   patience: 5
   factor: 0.2
   weight_decay: 0.07455776412929914
   weight: 1e2
   cov_weight: 0.0001
   propcov: True
   covaug: True
   loss: Huber_loss05
   rotloss: Huber_loss005
   save_freq: 25
   eval_freq: 5
}
