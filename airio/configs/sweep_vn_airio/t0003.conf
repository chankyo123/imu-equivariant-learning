general:
{ exp_dir: experiments/sweep_vn_airio/t0003_vn_codewithrot }

dataset:
{
   include "../datasets/TLIO/tlio_body.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codewithrot
   lr: 3.353984037098799e-05
   min_lr: 1e-6
   batch_size: 256
   max_epoches: 75
   patience: 5
   factor: 0.2
   weight_decay: 0.0022138411657309253
   weight: 1e2
   cov_weight: 0.0001
   propcov: True
   covaug: True
   loss: L2
   rotloss: Huber_loss005
   save_freq: 75
   eval_freq: 5
}
