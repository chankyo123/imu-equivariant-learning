general:
{ exp_dir: experiments/sweep_vn_airio/t0004_vn_codewithrot }

dataset:
{
   include "../datasets/TLIO/tlio_body.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codewithrot
   lr: 0.000259591892069878
   min_lr: 1e-6
   batch_size: 128
   max_epoches: 85
   patience: 5
   factor: 0.2
   weight_decay: 2.361574889561295e-06
   weight: 1e2
   cov_weight: 0.0001
   propcov: True
   covaug: True
   loss: Huber_loss05
   rotloss: Huber_loss005
   save_freq: 85
   eval_freq: 5
}
