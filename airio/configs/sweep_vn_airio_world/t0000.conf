general:
{ exp_dir: experiments/sweep_vn_airio_world/t0000_vn_codenetmotion }

dataset:
{
   include "../datasets/TLIO/tlio_world.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codenetmotion
   lr: 2.3848428912861282e-05
   min_lr: 1e-6
   batch_size: 512
   max_epoches: 140
   patience: 5
   factor: 0.2
   weight_decay: 0.009693559575774316
   weight: 1e2
   cov_weight: 1e-4
   propcov: True
   covaug: True
   loss: Huber_loss005
   rotloss: Huber_loss005
   save_freq: 140
   eval_freq: 5
}
