general:
{ exp_dir: experiments/sweep_vn_airio_world/t0001_vn_codewithrot }

dataset:
{
   include "../datasets/TLIO/tlio_world.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codewithrot
   lr: 0.0011617604563218245
   min_lr: 1e-6
   batch_size: 512
   max_epoches: 15
   patience: 5
   factor: 0.2
   weight_decay: 0.0019829600037791387
   weight: 1e2
   cov_weight: 0.0001
   propcov: True
   covaug: True
   loss: L2
   rotloss: Huber_loss005
   save_freq: 15
   eval_freq: 5
}
