general:
{ exp_dir: experiments/sweep_vn_airio_world/t0002_vn_codenetmotion }

dataset:
{
   include "../datasets/TLIO/tlio_world.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codenetmotion
   lr: 0.0004088333854313017
   min_lr: 1e-6
   batch_size: 512
   max_epoches: 20
   patience: 5
   factor: 0.2
   weight_decay: 0.012259148393366066
   weight: 1e2
   cov_weight: 0.0001
   propcov: True
   covaug: True
   loss: L2
   rotloss: Huber_loss005
   save_freq: 20
   eval_freq: 5
}
