general:
{ exp_dir: experiments/sweep_vn_airio_world/t0004_vn_codewithrot }

dataset:
{
   include "../datasets/TLIO/tlio_world.conf"
   collate: {type: motion}
}

train:
{
   network: vn_codewithrot
   lr: 0.004236950067722585
   min_lr: 1e-6
   batch_size: 128
   max_epoches: 90
   patience: 5
   factor: 0.2
   weight_decay: 2.786887426571174e-06
   weight: 1e2
   cov_weight: 0.0001
   propcov: True
   covaug: True
   loss: L2
   rotloss: Huber_loss005
   save_freq: 90
   eval_freq: 5
}
